<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CropAdvisor{% endblock %}</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet">
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet">

    <!-- Base styles -->
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/home.css') }}">

    <!-- Component styles -->
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/footer.css') }}">

    <!-- Page-specific styles -->
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand" href="{{ url_for('index') }}">
          <i class="fas fa-seedling"></i> CropAdvisor
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav" aria-controls="navbarNav"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% block nav %}
            {% endblock %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-content">
      {% block body %} {% endblock %}
    </div>

    <footer>
      <div class="container">
        <div class="footer-content">
          <p>&copy; 2024 CropAdvisor. All Rights Reserved.</p>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS (required for navbar toggle) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>

    <!-- Page-specific scripts -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
