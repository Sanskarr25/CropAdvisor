  <body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i
            class="fas fa-leaf me-2"></i>AgriSmart</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav"><span

          <ul class="navbar-nav ms-auto">

                href="pesticide_recommendation.html">Pesticide

    <section class="py-5 bg-light" id="recommendations">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <h2 class="text-center mb-5">Fertilizer Recommendation</h2>
            <div class="form-card p-4 p-md-5">
              <form>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Soil Type</label>
                    <div class="input-group">
                      <span class="input-group-text"><i
                          class="fas fa-mountain"></i></span>
                      <select class="form-select" required>
                        <option selected disabled value>Select soil
                          type</option>
                        <option>Sandy</option>
                        <option>Loamy</option>
                        <option>Clayey</option>
                        <option>Black</option>
                        <option>Red</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-12 mt-4">
                    <button type="submit"
                      class="btn btn-primary btn-lg w-100">Get Fertilizer
                      Recommendations</button>
                  </div>
                </div>
              </form>
              <div class="mt-5" id="fertilizerResultsSection"
                style="display:none;"> </div>
            </div>
          </div>
        </div>
